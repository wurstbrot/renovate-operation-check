[pytest]
markers =
    core: marks tests for core functionality that should always pass
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    legacy: marks tests that depend on legacy architecture (deselect with '-m "not legacy"')
    network: marks tests that require network access (deselect with '-m "not network"')
    slow: marks tests that are slow (deselect with '-m "not slow"')

addopts = -v --tb=short --durations=10 -q
testpaths = scripts/tests
timeout = 30
